<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trichyguard</title>
<meta name="description" content="Watches for a hand near your hair and locks the screen until it's clear. No accounts, no logging, no data ever stored.">
<meta name="theme-color" content="#141221">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0f0e17; --card:#1c1a2b; --text:#f2f0fa; --sub:#a9a5c4;
  --accent:#8b7cf6; --accent2:#c084fc; --bad:#f87171; --good:#4ade80;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f5fb; --card:#ffffff; --text:#1c1a2b; --sub:#615c7a; --accent:#7c5cf0; --accent2:#a855f7; }
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%; overflow:hidden;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100vh; padding:16px;
}
.wrap{width:100%; max-width:360px; text-align:center;}
.status{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; font-weight:700; font-size:.85rem; color:var(--sub);}
.status .dot{width:9px;height:9px;border-radius:50%; background:var(--sub);}
.status.watching .dot{background:var(--good); box-shadow:0 0 8px var(--good); animation:pulse 1.4s infinite;}
.status.alert .dot{background:var(--bad); box-shadow:0 0 8px var(--bad);}
.status.off .dot{background:var(--bad);}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
.preview-wrap{position:relative; border-radius:16px; overflow:hidden; background:#000; display:none;}
.preview-wrap.active{display:block;}
video{width:100%; display:block; transform:scaleX(-1);}
canvas{position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1);}
.error-box{background:var(--card); border-radius:14px; padding:16px; font-size:.85rem; color:var(--sub); line-height:1.5;}

.stop-overlay{
  position:fixed; inset:0; z-index:99999;
  background:radial-gradient(circle at 50% 30%, #2b0f14, #150609 70%);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px; cursor:pointer; user-select:none;
}
.stop-overlay.active{display:flex;}
.stop-ring{
  width:min(46vw,220px); height:min(46vw,220px); border-radius:50%;
  border:6px solid var(--bad); display:flex; align-items:center; justify-content:center;
  font-size:min(14vw,64px); color:var(--bad); margin-bottom:28px;
  box-shadow:0 0 60px rgba(248,113,113,.5);
  animation:stopPulse 1.1s ease-in-out infinite;
}
@keyframes stopPulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
.stop-ring.clearing{border-color:var(--good); color:var(--good); box-shadow:0 0 60px rgba(74,222,128,.5); animation:none;}
.stop-title{font-size:clamp(1.5rem,6vw,2.2rem); font-weight:800; color:#fff; margin-bottom:10px;}
.stop-sub{font-size:1rem; color:#e3d9dc; max-width:380px; line-height:1.5;}
</style>
</head>
<body>

<div class="wrap" id="mainWrap">
  <div class="status" id="statusRow"><div class="dot"></div><span id="statusText">Starting…</span></div>
  <div class="preview-wrap" id="previewWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="error-box" id="errorBox" style="display:none;"></div>
</div>

<div class="stop-overlay" id="stopOverlay" onclick="handleStopOverlayClick()">
  <div class="stop-ring" id="stopRing">✋</div>
  <div class="stop-title" id="stopTitle">Hand caught near your hair</div>
  <div class="stop-sub" id="stopSub">This won't lift until your hand has been away for a couple of seconds.</div>
</div>

<script>
const VISION_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const HAND_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

const TICK_MS=180;
const ALERT_FRAMES=6;
const CLEAR_MS=2500;
const CLEAR_TICKS=Math.ceil(CLEAR_MS/TICK_MS);
const POST_CLEAR_COOLDOWN_MS=1000;

let handLandmarker=null, faceDetector=null, tickHandle=null;
let nearCount=0, awayTicks=0, hardStopActive=false, postClearCooldownUntil=0;
let stream=null;

function setStatus(mode, text){
  const row=document.getElementById('statusRow');
  row.classList.remove('watching','alert','off');
  if(mode) row.classList.add(mode);
  document.getElementById('statusText').textContent=text;
}
function showError(msg){
  document.getElementById('errorBox').style.display='block';
  document.getElementById('errorBox').textContent=msg;
  setStatus('off', 'Not watching');
}

function withTimeout(promise, ms, timeoutMessage){
  return new Promise((resolve, reject)=>{
    const t=setTimeout(()=>reject(new Error(timeoutMessage)), ms);
    promise.then(v=>{ clearTimeout(t); resolve(v); }, e=>{ clearTimeout(t); reject(e); });
  });
}

async function loadModels(){
  const visionMod=await import(VISION_BASE+'/vision_bundle.mjs');
  const {FilesetResolver, HandLandmarker, FaceDetector}=visionMod;
  const vision=await FilesetResolver.forVisionTasks(VISION_BASE+'/wasm');
  const handOpts={
    baseOptions:{modelAssetPath:HAND_MODEL},
    numHands:2, runningMode:'VIDEO',
    minHandDetectionConfidence:0.3, minHandPresenceConfidence:0.3, minTrackingConfidence:0.3
  };
  const faceOpts={ baseOptions:{modelAssetPath:FACE_MODEL}, runningMode:'VIDEO' };
  try{
    handLandmarker=await HandLandmarker.createFromOptions(vision, {...handOpts, baseOptions:{...handOpts.baseOptions, delegate:'GPU'}});
    faceDetector=await FaceDetector.createFromOptions(vision, {...faceOpts, baseOptions:{...faceOpts.baseOptions, delegate:'GPU'}});
  }catch(gpuErr){
    handLandmarker=await HandLandmarker.createFromOptions(vision, {...handOpts, baseOptions:{...handOpts.baseOptions, delegate:'CPU'}});
    faceDetector=await FaceDetector.createFromOptions(vision, {...faceOpts, baseOptions:{...faceOpts.baseOptions, delegate:'CPU'}});
  }
}

async function start(){
  setStatus(null, 'Requesting camera…');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    const video=document.getElementById('video');
    video.srcObject=stream;
    await video.play();
    document.getElementById('previewWrap').classList.add('active');

    setStatus(null, 'Downloading on-device model…');
    await withTimeout(loadModels(), 120000, 'Model download took too long. Check your connection and reload.');

    setStatus('watching', 'Watching');
    tickHandle=setInterval(tick, TICK_MS);
  }catch(err){
    console.error('Trichyguard failed to start', err);
    let msg='Could not start.';
    if(err && err.name==='NotAllowedError') msg='Camera permission was denied.';
    else if(err && err.name==='NotFoundError') msg='No camera was found on this device.';
    else if(err && err.message) msg=err.message;
    showError(msg);
  }
}

function tick(){
  const video=document.getElementById('video');
  if(video.readyState<2) return;
  const now=performance.now();

  let faceResult, handResult;
  try{
    faceResult=faceDetector.detectForVideo(video, now);
    handResult=handLandmarker.detectForVideo(video, now);
  }catch(e){ return; }

  const canvas=document.getElementById('overlay');
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!faceResult.detections.length){
    if(!hardStopActive) setStatus('watching','Watching — no face in frame');
    nearCount=0;
    return;
  }
  const box=faceResult.detections[0].boundingBox;
  const zone={
    x: box.originX - box.width*0.15,
    y: box.originY - box.height*0.75,
    w: box.width*1.3,
    h: box.height*1.05
  };
  ctx.strokeStyle='rgba(192,132,252,0.9)'; ctx.lineWidth=3;
  ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);

  let handInZone=false;
  (handResult.landmarks||[]).forEach(lm=>{
    [0,4,8].forEach(i=>{
      const pt=lm[i];
      const px=pt.x*canvas.width, py=pt.y*canvas.height;
      const inside = px>=zone.x && px<=zone.x+zone.w && py>=zone.y && py<=zone.y+zone.h;
      ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2);
      ctx.fillStyle = inside ? 'rgba(248,113,113,0.9)' : 'rgba(74,222,128,0.9)';
      ctx.fill();
      if(inside) handInZone=true;
    });
  });

  if(handInZone){
    nearCount++;
    awayTicks=0;
    if(hardStopActive){
      resetStopOverlayToLocked();
    }else{
      setStatus('alert', 'Hand near hair');
      if(nearCount>=ALERT_FRAMES && Date.now()>=postClearCooldownUntil){
        nearCount=0;
        activateHardStop();
      }
    }
  }else{
    nearCount=0;
    if(hardStopActive){
      awayTicks++;
      updateStopOverlayProgress(awayTicks);
      if(awayTicks>=CLEAR_TICKS){
        clearHardStop();
      }
    }else{
      setStatus('watching', 'Watching');
    }
  }
}

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.4);
  }catch(e){}
}
function resetStopOverlayToLocked(){
  document.getElementById('stopRing').classList.remove('clearing');
  document.getElementById('stopRing').textContent='✋';
  document.getElementById('stopTitle').textContent='Hand caught near your hair';
  document.getElementById('stopSub').textContent="This won't lift until your hand has been away for a couple of seconds.";
  setStatus('alert', 'Locked');
}
function updateStopOverlayProgress(ticks){
  const remainingMs=Math.max(0, (CLEAR_TICKS-ticks)*TICK_MS);
  document.getElementById('stopRing').classList.add('clearing');
  document.getElementById('stopRing').textContent='✓';
  document.getElementById('stopTitle').textContent='Hand is clear — hold it there';
  document.getElementById('stopSub').textContent='Unlocking in '+(remainingMs/1000).toFixed(1)+'s if it stays away…';
  setStatus('alert', 'Clearing…');
}
function activateHardStop(){
  hardStopActive=true;
  awayTicks=0;
  resetStopOverlayToLocked();
  document.getElementById('stopOverlay').classList.add('active');
  beep();
  if(navigator.vibrate) navigator.vibrate([150,80,150,80,150]);
  if(!document.fullscreenElement && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
  // Only present when running as the Electron app (see trichyguard-app), not
  // the plain browser version -- a real fullscreen/focus request with no
  // gesture restriction, which a browser page can't do on its own.
  if(window.trichyguardNative) window.trichyguardNative.lock();
}
function clearHardStop(){
  hardStopActive=false;
  awayTicks=0;
  postClearCooldownUntil=Date.now()+POST_CLEAR_COOLDOWN_MS;
  document.getElementById('stopOverlay').classList.remove('active');
  setStatus('watching', 'Watching');
  if(window.trichyguardNative) window.trichyguardNative.unlock();
}
function handleStopOverlayClick(){
  if(!document.fullscreenElement && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}
window.addEventListener('keydown', e=>{
  if(hardStopActive){ e.preventDefault(); e.stopPropagation(); }
}, true);
window.addEventListener('beforeunload', e=>{
  e.preventDefault(); e.returnValue='';
});
window.addEventListener('contextmenu', e=>{
  if(hardStopActive) e.preventDefault();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

start();
</script>
</body>
</html>
